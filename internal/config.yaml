general:
  lite-server: "http://127.0.0.1:12340"
  media-user-token: ""
  authorization-token: ""
  language: "ru-RU"
  storefront: "kz"
  exit-on-error: false
  max-memory-limit: 0
  proxy: ""

media:
  alac-max: 192000
  alac-fix: true
  atmos-max: 2768
  aac-type: "aac"
  get-m3u8-mode: "all"
  mv-max: 2160
  mv-audio-type: "atmos"

metadata:
  artwork:
    format: "jpg"
    embed: true
    save-animated: false
    emby-animated: false
    dl-for-playlist: false
    save-artist: false
  lyrics:
    embed: true
    save-file: false
    type: "lrc"
    extra: false
    format: "lrc"
  tags:
    itunes-id: false
    sort-order: false
    use-songinfo-for-playlist: false

paths:
  alac: "C:/projects/amdl/AM-Lossless"
  atmos: "C:/projects/amdl/AM-Atmos"
  aac: "C:/projects/amdl/AM-AAC"
  mv: "C:/projects/amdl/AM-MV"
  song-file: ""
  album-folder: ""
  playlist-folder: ""
  artist-folder: ""
  apple-master: false
  clean: false
  explicit: false
  limit-max: 200

convert:
  after-download: false
  format: "mp3"
  ffmpeg-path: "ffmpeg"
  extra-args: ""
  delete-bad-alac: false
  check-bad-alac: false
  skip-if-source-matches: false
  keep-original: true
  with-metadata: true
  skip-lossy-to-lossless: true
  warn-lossy-to-lossless: true
